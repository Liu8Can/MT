name: A自动签到

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'prefs.sqlite'

concurrency:
  group: mt-checkin-main
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 只读诊断论坛页面（不登录、不签到）
      continue-on-error: true
      run: python diagnose_mt.py

    - name: 测试新代理池访问 MT 登录页（不发送账号密码）
      continue-on-error: true
      run: python -u test_proxy_pool.py

    - name: 运行签到
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
      run: python main.py
    - name: Empty commit
      if: github.event_name != 'push'
      run: |
        git config user.name "github-actions" >/dev/null 2>&1
        git config user.email "github-actions@github.com" >/dev/null 2>&1
        git commit --allow-empty -m "chore: keepalive" >/dev/null 2>&1
        git pull --quiet origin main >/dev/null 2>&1
        git push --quiet origin main >/dev/null 2>&1
